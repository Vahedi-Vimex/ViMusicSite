<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ViMusic — Playlist</title>

    <link
        rel="stylesheet"
        href="playlist.css">

</head>

<body>

    <div class="background">

        <div class="orb orb-green"></div>
        <div class="orb orb-cyan"></div>
        <div class="orb orb-red"></div>
        <div class="orb orb-purple"></div>

    </div>


    <!-- Header -->

    <header class="playlist-header">

        <a
            href="../index.html"
            class="back-button"
            aria-label="Back">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none">

                <path
                    d="M15 18L9 12L15 6"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

        </a>


        <div class="header-title">

            <span class="header-icon">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none">

                    <path
                        d="M9 18V5L21 3V16"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <circle
                        cx="6"
                        cy="18"
                        r="3"
                        stroke="currentColor"
                        stroke-width="2"/>

                    <circle
                        cx="18"
                        cy="16"
                        r="3"
                        stroke="currentColor"
                        stroke-width="2"/>

                </svg>

            </span>

            <h1>Music Playlist</h1>

        </div>

    </header>


    <!-- Dynamic Playlist -->

    <main
        class="playlist-container"
        id="playlist">

        <!-- Songs will be generated by playlist.js -->

    </main>


    <script src="playlist.js"></script>

</body>
</html>
